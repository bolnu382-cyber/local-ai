# Создаёт проект Android, собирает llama-server и APK, публикует APK в разделе Releases
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Write project files
        run: |
          cat > settings.gradle << 'ENDOFFILE_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LocalAI"
          include ':app'
          ENDOFFILE_0
          cat > build.gradle << 'ENDOFFILE_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ENDOFFILE_1
          cat > gradle.properties << 'ENDOFFILE_2'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=false
          ENDOFFILE_2
          mkdir -p app
          cat > app/build.gradle << 'ENDOFFILE_3'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ru.localai.chat'
              compileSdk 34

              defaultConfig {
                  applicationId 'ru.localai.chat'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
                  ndk {
                      abiFilters 'arm64-v8a'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                      keepDebugSymbols.add('**/*.so')
                  }
              }
          }
          ENDOFFILE_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'ENDOFFILE_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Локальный ИИ"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ServerService"
                      android:exported="false" />
              </application>
          </manifest>
          ENDOFFILE_4
          mkdir -p app/src/main/java/ru/localai/chat
          cat > app/src/main/java/ru/localai/chat/ServerService.java << 'ENDOFFILE_5'
          package ru.localai.chat;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.os.IBinder;

          import java.io.File;
          import java.io.FileWriter;

          public class ServerService extends Service {
              static final int PORT = 8765;
              static volatile Process proc;
              static volatile String error;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  NotificationManager nm = getSystemService(NotificationManager.class);
                  nm.createNotificationChannel(new NotificationChannel("ai", "Локальный ИИ", NotificationManager.IMPORTANCE_LOW));
                  Notification n = new Notification.Builder(this, "ai")
                          .setContentTitle("Локальный ИИ работает")
                          .setContentText("Модель загружена в память")
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .build();
                  startForeground(1, n);

                  String model = intent == null ? null : intent.getStringExtra("model");
                  if (model != null && (proc == null || !proc.isAlive())) {
                      try {
                          File exe = new File(getApplicationInfo().nativeLibraryDir, "libllama_server.so");
                          int threads = Math.max(2, Math.min(4, Runtime.getRuntime().availableProcessors()));
                          ProcessBuilder pb = new ProcessBuilder(
                                  exe.getAbsolutePath(),
                                  "-m", model,
                                  "-c", "2048",
                                  "-b", "256",
                                  "-ub", "128",
                                  "-t", String.valueOf(threads),
                                  "-np", "1",
                                  "--host", "127.0.0.1",
                                  "--port", String.valueOf(PORT));
                          pb.directory(getFilesDir());
                          pb.redirectErrorStream(true);
                          pb.redirectOutput(new File(getFilesDir(), "server.log"));
                          proc = pb.start();
                      } catch (Exception e) {
                          error = String.valueOf(e);
                          try {
                              FileWriter w = new FileWriter(new File(getFilesDir(), "server.log"));
                              w.write(error);
                              w.close();
                          } catch (Exception ignored) {
                          }
                      }
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  Process p = proc;
                  if (p != null) {
                      p.destroy();
                  }
                  proc = null;
                  super.onDestroy();
              }
          }
          ENDOFFILE_5
          mkdir -p app/src/main/java/ru/localai/chat
          cat > app/src/main/java/ru/localai/chat/MainActivity.java << 'ENDOFFILE_6'
          package ru.localai.chat;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              static final String MODEL_URL =
                      "https://huggingface.co/bartowski/gemma-2-2b-it-GGUF/resolve/main/gemma-2-2b-it-Q4_K_M.gguf";
              static final int PICK = 11;
              static final long MIN_SIZE = 100000000L;

              TextView status;
              ProgressBar bar;
              Button btnStart, btnDown, btnLight, btnPick;
              static final String LIGHT_URL =
                      "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf";
              LinearLayout box;
              WebView web;
              File model;
              File histFile;
              volatile boolean busy = false;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  File dir = getExternalFilesDir(null);
                  if (dir == null) {
                      dir = getFilesDir();
                  }
                  model = new File(dir, "model.gguf");
                  histFile = new File(getFilesDir(), "history.json");

                  FrameLayout root = new FrameLayout(this);
                  box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  int p = (int) (24 * getResources().getDisplayMetrics().density);
                  box.setPadding(p, p, p, p);

                  status = new TextView(this);
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(1000);
                  bar.setVisibility(View.GONE);

                  btnStart = new Button(this);
                  btnStart.setText("Открыть чат");
                  btnStart.setOnClickListener(v -> openChat());

                  btnDown = new Button(this);
                  btnDown.setText("Скачать Gemma 2 (1,7 ГБ, умнее)");
                  btnDown.setOnClickListener(v -> download(MODEL_URL));

                  btnLight = new Button(this);
                  btnLight.setText("Скачать лёгкую модель Qwen 1,5B (1,1 ГБ, быстрее)");
                  btnLight.setOnClickListener(v -> download(LIGHT_URL));

                  btnPick = new Button(this);
                  btnPick.setText("Выбрать файл модели .gguf");
                  btnPick.setOnClickListener(v -> pick());

                  box.addView(status);
                  box.addView(bar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  box.addView(btnStart);
                  box.addView(btnDown);
                  box.addView(btnLight);
                  box.addView(btnPick);

                  web = new WebView(this);
                  web.setVisibility(View.GONE);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "Android");

                  root.addView(box, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  root.addView(web, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }

                  if (hasModel()) {
                      openChat();
                  } else {
                      showSetup("Модель не найдена. Скачайте её или выберите файл .gguf.");
                  }
              }

              boolean hasModel() {
                  return model.exists() && model.length() > MIN_SIZE;
              }

              class Bridge {
                  @JavascriptInterface
                  public void stopServer() {
                      runOnUiThread(() -> {
                          stopService(new Intent(MainActivity.this, ServerService.class));
                          finishAffinity();
                      });
                  }

                  @JavascriptInterface
                  public String status() {
                      if (ServerService.error != null) {
                          return "error:" + ServerService.error;
                      }
                      Process p = ServerService.proc;
                      if (p != null && !p.isAlive()) {
                          return "error:" + readLog();
                      }
                      return "loading";
                  }

                  @JavascriptInterface
                  public void killServer() {
                      Process p = ServerService.proc;
                      if (p != null) {
                          p.destroy();
                      }
                      ServerService.proc = null;
                      ServerService.error = null;
                  }

                  @JavascriptInterface
                  public void restart() {
                      runOnUiThread(() -> startServerProcess());
                  }

                  @JavascriptInterface
                  public String loadHistory() {
                      try {
                          if (!histFile.exists()) {
                              return "[]";
                          }
                          return readAll(new FileInputStream(histFile));
                      } catch (Exception e) {
                          return "[]";
                      }
                  }

                  @JavascriptInterface
                  public void saveHistory(String json) {
                      try {
                          FileOutputStream o = new FileOutputStream(histFile, false);
                          o.write(json.getBytes("UTF-8"));
                          o.close();
                      } catch (Exception ignored) {
                      }
                  }

                  @JavascriptInterface
                  public void changeModel() {
                      runOnUiThread(() -> {
                          stopService(new Intent(MainActivity.this, ServerService.class));
                          ServerService.proc = null;
                          showSetup("Выберите другую модель или скачайте заново.");
                      });
                  }
              }

              String readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) {
                      bo.write(buf, 0, n);
                  }
                  in.close();
                  return bo.toString("UTF-8");
              }

              void showSetup(String msg) {
                  box.setVisibility(View.VISIBLE);
                  web.setVisibility(View.GONE);
                  status.setText(msg);
                  btnStart.setVisibility(hasModel() ? View.VISIBLE : View.GONE);
                  btnStart.setEnabled(true);
                  btnDown.setEnabled(true);
                  btnLight.setEnabled(true);
                  btnPick.setEnabled(true);
                  bar.setVisibility(View.GONE);
              }

              void showBusy(String msg) {
                  box.setVisibility(View.VISIBLE);
                  web.setVisibility(View.GONE);
                  status.setText(msg);
                  btnStart.setEnabled(false);
                  btnDown.setEnabled(false);
                  btnLight.setEnabled(false);
                  btnPick.setEnabled(false);
              }

              void startServerProcess() {
                  Process pr = ServerService.proc;
                  if (pr != null && pr.isAlive()) {
                      return;
                  }
                  ServerService.error = null;
                  ServerService.proc = null;
                  Intent i = new Intent(this, ServerService.class);
                  i.putExtra("model", model.getAbsolutePath());
                  startForegroundService(i);
              }

              void openChat() {
                  startServerProcess();
                  showChat();
              }

              void showChat() {
                  try {
                      String html = readAll(getAssets().open("chat.html"));
                      box.setVisibility(View.GONE);
                      web.setVisibility(View.VISIBLE);
                      web.loadDataWithBaseURL("http://127.0.0.1:" + ServerService.PORT + "/", html, "text/html", "utf-8", null);
                  } catch (Exception e) {
                      showSetup("Ошибка страницы чата: " + e);
                  }
              }

              String readLog() {
                  try {
                      String s = readAll(new FileInputStream(new File(getFilesDir(), "server.log")));
                      return s.length() > 1500 ? s.substring(s.length() - 1500) : s;
                  } catch (Exception e) {
                      return "Журнал недоступен";
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.getVisibility() == View.VISIBLE) {
                      moveTaskToBack(true);
                  } else {
                      super.onBackPressed();
                  }
              }

              void download(final String url) {
                  if (busy) {
                      return;
                  }
                  busy = true;
                  showBusy("Подключение...");
                  bar.setVisibility(View.VISIBLE);
                  bar.setProgress(0);
                  new Thread(() -> {
                      File part = new File(model.getParentFile(), "model.gguf.part");
                      File mark = new File(model.getParentFile(), "model.gguf.url");
                      try {
                          String prev = mark.exists() ? readAll(new FileInputStream(mark)) : "";
                          if (!prev.equals(url) && part.exists()) {
                              part.delete();
                          }
                          FileOutputStream mo = new FileOutputStream(mark, false);
                          mo.write(url.getBytes("UTF-8"));
                          mo.close();
                          long have = part.exists() ? part.length() : 0;
                          HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                          c.setConnectTimeout(30000);
                          c.setReadTimeout(60000);
                          c.setInstanceFollowRedirects(true);
                          if (have > 0) {
                              c.setRequestProperty("Range", "bytes=" + have + "-");
                          }
                          int code = c.getResponseCode();
                          if (code != 200 && code != 206) {
                              throw new IOException("HTTP " + code);
                          }
                          boolean append = code == 206;
                          long base = append ? have : 0;
                          long total = c.getContentLengthLong() + base;
                          InputStream in = c.getInputStream();
                          OutputStream out = new FileOutputStream(part, append);
                          byte[] buf = new byte[262144];
                          long done = base;
                          long last = 0;
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                              done += n;
                              long now = System.currentTimeMillis();
                              if (now - last > 500) {
                                  last = now;
                                  final long d = done;
                                  final long t = total;
                                  runOnUiThread(() -> {
                                      status.setText("Скачано " + (d / 1048576) + " МБ из " + (t / 1048576) + " МБ");
                                      if (t > 0) {
                                          bar.setProgress((int) (d * 1000 / t));
                                      }
                                  });
                              }
                          }
                          out.close();
                          in.close();
                          if (model.exists()) {
                              model.delete();
                          }
                          if (!part.renameTo(model)) {
                              throw new IOException("Не удалось сохранить файл модели");
                          }
                          busy = false;
                          runOnUiThread(this::openChat);
                      } catch (Exception e) {
                          busy = false;
                          final String m = String.valueOf(e.getMessage());
                          runOnUiThread(() -> showSetup("Ошибка загрузки: " + m + "\nНажмите «Скачать» ещё раз, загрузка продолжится."));
                      }
                  }).start();
              }

              void pick() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(i, PICK);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == PICK && res == RESULT_OK && data != null && data.getData() != null) {
                      copyModel(data.getData());
                  }
              }

              void copyModel(Uri uri) {
                  if (busy) {
                      return;
                  }
                  busy = true;
                  showBusy("Копирование файла...");
                  new Thread(() -> {
                      File part = new File(model.getParentFile(), "model.gguf.part");
                      try {
                          InputStream in = getContentResolver().openInputStream(uri);
                          OutputStream out = new FileOutputStream(part, false);
                          byte[] buf = new byte[262144];
                          long done = 0;
                          long last = 0;
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              out.write(buf, 0, n);
                              done += n;
                              long now = System.currentTimeMillis();
                              if (now - last > 500) {
                                  last = now;
                                  final long d = done;
                                  runOnUiThread(() -> status.setText("Скопировано " + (d / 1048576) + " МБ"));
                              }
                          }
                          out.close();
                          in.close();
                          if (model.exists()) {
                              model.delete();
                          }
                          if (!part.renameTo(model)) {
                              throw new IOException("Не удалось сохранить файл модели");
                          }
                          busy = false;
                          runOnUiThread(this::openChat);
                      } catch (Exception e) {
                          busy = false;
                          final String m = String.valueOf(e.getMessage());
                          runOnUiThread(() -> showSetup("Ошибка копирования: " + m));
                      }
                  }).start();
              }
          }
          ENDOFFILE_6
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/chat.html << 'ENDOFFILE_7'
          <!doctype html>
          <html lang="ru">
