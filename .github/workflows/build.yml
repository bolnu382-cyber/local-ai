            </div>
          </div>
          <script>
          var RULE = "Ты умный помощник. Отвечай на правильном русском языке, по существу и понятно, с примерами. Не задавай уточняющих вопросов и не повторяй вопрос. Если данных не хватает, прими разумное допущение и назови его. Задачи решай по шагам и в конце напиши: Ответ: и результат.";
          var MAXCHARS = 2200;
          var data = { cur: null, chats: [] };
          var ctrl = null;
          var ready = false;
          var logEl = document.getElementById('log');
          var inp = document.getElementById('inp');
          var st = document.getElementById('st');
          var t0 = Date.now();

          function uid() { return 'c' + Date.now().toString(36) + Math.floor(Math.random() * 1000); }
          function cur() {
            for (var i = 0; i < data.chats.length; i++) { if (data.chats[i].id === data.cur) { return data.chats[i]; } }
            return null;
          }
          function save() {
            try { Android.saveHistory(JSON.stringify(data)); } catch (e) { }
          }
          function load() {
            var raw = [];
            try { raw = JSON.parse(Android.loadHistory() || '[]'); } catch (e) { raw = []; }
            if (Array.isArray(raw)) {
              data = { cur: null, chats: [] };
              if (raw.length) {
                data.chats.push({ id: uid(), title: String(raw[0].content).slice(0, 30), msgs: raw, ts: Date.now() });
              }
            } else if (raw && raw.chats) {
              data = raw;
            }
            if (!data.chats.length) { newChat(); }
            else if (!cur()) { data.cur = data.chats[0].id; }
            render();
          }
          function newChat() {
            var c = cur();
            if (c && c.msgs.length === 0) { render(); return; }
            c = { id: uid(), title: '', msgs: [], ts: Date.now() };
            data.chats.unshift(c);
            data.cur = c.id;
            save();
            render();
          }
          function abortGen() { if (ctrl) { ctrl.abort(); } }
          function add(cls, text) {
            var d = document.createElement('div');
            d.className = 'm ' + cls;
            d.textContent = text;
            logEl.appendChild(d);
            logEl.scrollTop = logEl.scrollHeight;
            return d;
          }
          function render() {
            var c = cur();
            logEl.innerHTML = '';
            document.getElementById('title').textContent = c && c.title ? c.title : 'Новый чат';
            if (c) {
              for (var i = 0; i < c.msgs.length; i++) {
                add(c.msgs[i].role === 'user' ? 'u' : 'a', c.msgs[i].content);
              }
            }
          }
          function renderList() {
            var l = document.getElementById('list');
            l.innerHTML = '';
            data.chats.forEach(function (c) {
              var r = document.createElement('div');
              r.className = 'row';
              var b = document.createElement('button');
              b.className = 't' + (c.id === data.cur ? ' cur' : '');
              b.textContent = (c.title || 'Новый чат') + ' (' + Math.floor(c.msgs.length / 2) + ')';
              b.onclick = function () { abortGen(); data.cur = c.id; save(); render(); closeOv(); };
              var x = document.createElement('button');
              x.className = 'x';
              x.textContent = 'Удалить';
              x.onclick = function () {
                if (!confirm('Удалить этот чат?')) { return; }
                abortGen();
                data.chats = data.chats.filter(function (z) { return z.id !== c.id; });
                if (!data.chats.length) { data.cur = null; newChat(); }
                else if (!cur()) { data.cur = data.chats[0].id; }
                save(); render(); renderList();
              };
              r.appendChild(b);
              r.appendChild(x);
              l.appendChild(r);
            });
          }
          function openOv() { renderList(); document.getElementById('ov').className = 'on'; }
          function closeOv() { document.getElementById('ov').className = ''; }

          function recent(c) {
            var out = [];
            var n = 0;
            for (var i = c.msgs.length - 1; i >= 0; i--) {
              n += c.msgs[i].content.length;
              if (n > MAXCHARS || out.length >= 6) { break; }
              out.unshift(c.msgs[i]);
            }
            while (out.length && out[0].role !== 'user') { out.shift(); }
            return out;
          }
          function clean(t) {
            return t.replace(/<think>[\s\S]*?<\/think>/g, '').replace(/<think>[\s\S]*$/, '').trim();
          }
          function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

          async function poll() {
            while (!ready) {
              try {
                var r = await fetch('/health');
                if (r.ok) {
                  ready = true;
                  st.className = 'ok';
                  st.textContent = 'Модель готова';
                  setTimeout(function () { if (ready) { st.style.display = 'none'; } }, 2500);
                  return;
                }
              } catch (e) { }
              var s = '';
              try { s = Android.status(); } catch (e) { }
              if (s.indexOf('error:') === 0) {
                st.className = 'err';
                st.textContent = 'Ошибка запуска модели:\n' + s.slice(6) + '\nОткройте «Чаты» и нажмите «Сменить модель».';
                try { Android.restart(); } catch (e) { }
                await sleep(15000);
              } else {
                st.className = '';
                st.textContent = 'Модель загружается... ' + Math.round((Date.now() - t0) / 1000) + ' с. Можно писать вопрос, ответ придёт после загрузки.';
                await sleep(1000);
              }
            }
          }
          async function waitReady() { while (!ready) { await sleep(500); } }

          async function stream(msgs, max, onText, signal) {
            var r = await fetch('/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ messages: msgs, max_tokens: max, temperature: 0.5, top_p: 0.9, repeat_penalty: 1.1, stream: true }),
              signal: signal
            });
            if (!r.ok) { throw new Error('HTTP ' + r.status); }
            var reader = r.body.getReader();
            var dec = new TextDecoder();
            var buf = '';
            var full = '';
            while (true) {
              var timer;
              var guard = new Promise(function (_, rej) { timer = setTimeout(function () { rej(new Error('нет ответа 3 минуты')); }, 180000); });
              var chunk;
              try { chunk = await Promise.race([reader.read(), guard]); } finally { clearTimeout(timer); }
              if (chunk.done) { break; }
              buf += dec.decode(chunk.value, { stream: true });
              var i;
              while ((i = buf.indexOf('\n')) >= 0) {
                var line = buf.slice(0, i).trim();
                buf = buf.slice(i + 1);
                if (line.indexOf('data:') !== 0) { continue; }
                var d = line.slice(5).trim();
                if (d === '[DONE]') { continue; }
                try {
                  var j = JSON.parse(d);
                  var t = j.choices[0].delta && j.choices[0].delta.content;
                  if (t) { full += t; onText(full); }
                } catch (e) { }
              }
            }
            return full;
          }

          async function send() {
            var q = inp.value.trim();
            if (!q || ctrl) { return; }
            var c = cur();
            if (q === '/clear') { inp.value = ''; c.msgs = []; save(); render(); return; }
            inp.value = '';
            var deep = /^д\s/i.test(q);
            if (deep) { q = q.slice(2).trim(); }
            add('u', q);
            var out = add('a', ready ? '...' : 'Ожидаю загрузки модели...');
            ctrl = new AbortController();
            var ans = '';
            try {
              await waitReady();
              out.textContent = '...';
              var msgs = recent(c).concat([{ role: 'user', content: RULE + '\n\nВопрос: ' + q }]);
              ans = clean(await stream(msgs, 500, function (t) {
                out.textContent = clean(t) || '...';
                logEl.scrollTop = logEl.scrollHeight;
              }, ctrl.signal));
              if (deep) {
                out.textContent = 'Проверяю ответ...';
                var chk = 'Вопрос: ' + q + '\n\nЧерновик ответа:\n' + ans + '\n\nПроверь черновик на ошибки и логику. Исправь их и улучши язык. Напиши только итоговый ответ на русском языке, без слов о проверке.';
                ans = clean(await stream([{ role: 'user', content: chk }], 500, function (t) {
                  out.textContent = clean(t) || 'Проверяю ответ...';
                  logEl.scrollTop = logEl.scrollHeight;
                }, ctrl.signal));
              }
              c.msgs.push({ role: 'user', content: q }, { role: 'assistant', content: ans });
              if (!c.title) { c.title = q.slice(0, 30); document.getElementById('title').textContent = c.title; }
              c.ts = Date.now();
              save();
            } catch (e) {
              if (e.name === 'AbortError') {
                out.textContent = (ans ? ans + '\n' : '') + '[остановлено]';
              } else {
                out.textContent = 'Ошибка: ' + e.message + '\nНажмите «Чаты», затем «Перезапустить модель».';
              }
            }
            ctrl = null;
          }

          document.getElementById('send').onclick = send;
          document.getElementById('stop').onclick = abortGen;
          document.getElementById('new').onclick = function () { abortGen(); newChat(); };
          document.getElementById('new2').onclick = function () { abortGen(); newChat(); closeOv(); };
          document.getElementById('chats').onclick = openOv;
          document.getElementById('back').onclick = closeOv;
          document.getElementById('clearall').onclick = function () {
            if (!confirm('Удалить все чаты?')) { return; }
            abortGen(); data = { cur: null, chats: [] }; newChat(); renderList();
          };
          document.getElementById('model').onclick = function () { Android.changeModel(); };
          document.getElementById('restart').onclick = function () {
            abortGen(); ready = false; t0 = Date.now(); st.style.display = 'block'; st.className = '';
            try { Android.killServer(); Android.restart(); } catch (e) { }
            poll(); closeOv();
          };
          document.getElementById('quit').onclick = function () { Android.stopServer(); };
          load();
          poll();
          </script>
          </body>
          </html>
          ENDOFFILE_7
      - name: Build llama-server for Android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build build-android --target llama-server -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build-android/bin/llama-server app/src/main/jniLibs/arm64-v8a/libllama_server.so
          ls -l app/src/main/jniLibs/arm64-v8a
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Publish APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LocalAI.apk
          gh release create "v${{ github.run_number }}" LocalAI.apk --title "Local AI v${{ github.run_number }}" --notes "Установочный файл LocalAI.apk"
